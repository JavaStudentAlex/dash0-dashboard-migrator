[project]
name = "dd2dash0"
version = "0.1.0"
description = "Migrate Datadog dashboards and monitors to Dash0 Perses dashboards and check rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dd2dash0 = "dd2dash0.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd2dash0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
